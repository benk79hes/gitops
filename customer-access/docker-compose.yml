version: '3.8'

services:
  sftp:
    image: atmoz/sftp:alpine
    container_name: customer_sftp
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./sftp-users.conf:/etc/sftp/users.conf:ro
      - ../backups:/home/backups:ro
      - ./ssh-keys:/etc/ssh/ssh_host_keys:ro
    command: /etc/sftp/users.conf
    networks:
      - sftp-network

networks:
  sftp-network:
    driver: bridge
